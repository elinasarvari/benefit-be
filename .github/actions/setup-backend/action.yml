name: Set up the backend
description: Python 3.12 with uv and the locked dependencies
inputs:
  working-directory:
    description: Directory of the benefit-be checkout
    default: .
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: "3.12"
        enable-cache: true
    - run: uv sync --frozen
      shell: bash
      working-directory: ${{ inputs.working-directory }}
