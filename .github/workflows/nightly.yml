name: Nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ENV: test
  LLM_MODE: fake
  EMBEDDER: fake
  RERANKER: fake
  TRACING_ENABLED: "false"
  CI: "true"

jobs:
  e2e-all-browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: benefit-be
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/benefit-fe
          ref: main
          path: benefit-fe
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: benefit-fe/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: benefit-fe/.nvmrc
          cache: pnpm
          cache-dependency-path: benefit-fe/pnpm-lock.yaml
      - uses: ./benefit-be/.github/actions/setup-backend
        with:
          working-directory: benefit-be
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: benefit-fe
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('benefit-fe/pnpm-lock.yaml') }}
      # Firefox and WebKit need system libraries the runner image lacks, so the nightly keeps --with-deps,
      # with apt told to retry and time out instead of hanging on a slow Ubuntu mirror.
      - name: Install Playwright browsers and their system libraries
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          timeout 600 pnpm exec playwright install --with-deps
        working-directory: benefit-fe
      - uses: ./benefit-be/.github/actions/setup-services
        with:
          working-directory: benefit-be
      - name: Reset data and start the stack
        working-directory: benefit-be
        run: |
          make reset
          nohup uv run honcho -f Procfile.ci start > stack.log 2>&1 &
          scripts/ci/wait-ready.sh
      - name: API and stack tests
        working-directory: benefit-be
        run: uv run pytest -m "stack or api"
      - name: End-to-end tests
        working-directory: benefit-fe
        run: |
          set -a; source ../benefit-be/.env; set +a
          E2E_PASSWORD="$DEMO_PASSWORD" pnpm e2e:all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright
          path: |
            benefit-fe/playwright-report
            benefit-fe/test-results
            benefit-be/stack.log
