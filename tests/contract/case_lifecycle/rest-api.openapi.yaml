# 001 REST contract (ADR-001-02, -04, -07, -08, -09). Generated into repos/benefit-be/openapi/openapi.json
# by scripts/export_openapi.py (FR-000-26) and copied to tests/contract/case_lifecycle/ in the contracts step;
# benefit-fe regenerates src/api/generated/schema.d.ts from it (PL-3, FE-3).
# Status per path: built = exists on the feature branch; changed/new = this re-plan.
openapi: 3.1.0
info:
  title: Benefit Case API (001 additions)
  version: "1"
paths:
  /api/v1/applications:
    post: # changed: body carries the form (ADR-001-08); 409 carries related_case_id (ADR-001-09)
      operationId: submitApplication
      summary: Submit an application; opens one case per submission reference (FR-001-01, -23, -24, -25)
      security: [{session: []}]
      description: Role applicant; household from the session, never the body.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ApplicationSubmission"}}}
      responses:
        "201": {description: Case opened, content: {application/json: {schema: {$ref: "#/components/schemas/CaseStatus"}}}}
        "200": {description: Same submission reference already opened this case, content: {application/json: {schema: {$ref: "#/components/schemas/CaseStatus"}}}}
        "409": {description: "Refused: error.code=conflict; reason in error.fields[0].type (household_has_open_case | household_has_coverage | submission_reference_in_use); error.related_case_id set for the first two", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "422": {description: "validation_failed; error.fields[].field is the dotted form path (research R13)", content: {application/json: {schema: {$ref: "#/components/schemas/ErrorEnvelope"}}}}
        "401": {description: Not signed in}
        "403": {description: Role not allowed}
        "503": {description: Temporal unavailable; retry the same submission}
  /api/v1/cases:
    get: # new (ADR-001-07)
      operationId: listCases
      summary: Cases with state, days remaining and at-risk flag, soonest deadline first (FR-001-11, -26, -27)
      security: [{session: []}]
      description: >
        Applicant: their household's open cases (state filter ignored). Caseworker, supervisor: open cases,
        or every case in the given state.
      parameters:
        - {name: state, in: query, required: false, schema: {$ref: "#/components/schemas/CaseState"}}
        - {name: cursor, in: query, required: false, schema: {type: string, maxLength: 200}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CasePage"}}}}
        "401": {description: Not signed in}
        "422": {description: Invalid filter or cursor}
  /api/v1/cases/{case_id}:
    get: # changed: returns CaseDetail, a superset of CaseStatus (ADR-001-07); applicant misses audited (research R12)
      operationId: getCase
      summary: Case state, dates, outcome, coverage period and override (FR-001-11, -26, -27)
      security: [{session: []}]
      description: Applicant (own household only; override reason omitted), caseworker, supervisor.
      parameters:
        - {name: case_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CaseDetail"}}}}
        "401": {description: Not signed in}
        "404": {description: Not found or not visible to the caller (same response both ways)}
  /api/v1/cases/{case_id}/history:
    get: # new (ADR-001-07)
      operationId: getCaseHistory
      summary: Case history with case-clock and real time, actor and reason (FR-001-10, FR-001-13, FR-001-27)
      security: [{session: []}]
      description: Caseworker, supervisor. Ordered by seq.
      parameters:
        - {name: case_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, required: false, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CaseHistoryPage"}}}}
        "401": {description: Not signed in}
        "403": {description: Role not allowed (applicant)}
        "404": {description: Not found}
  /api/v1/cases/{case_id}/review-tasks/{task_id}/actions:
    post: # built (ADR-001-04 Option B)
      operationId: submitReviewAction
      summary: Caseworker action on an open review task (FR-001-07, -09, -20, -27)
      security: [{session: []}]
      parameters:
        - {name: case_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: task_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: "#/components/schemas/ReviewActionBody"}}}
      responses:
        "202": {description: Action accepted and signalled}
        "409": {description: Action not allowed for this task or state; recorded as rejected}
        "422": {description: Reason missing for an override}
        "403": {description: Role not allowed}
        "503": {description: Temporal unavailable}
components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: benefit_session}
  schemas:
    CaseState: {type: string, enum: [submitted, verifying, awaiting_applicant, determining, under_review, decided]}
    ApplicationSubmission:
      type: object
      additionalProperties: false
      required: [submission_reference, form]
      properties:
        submission_reference: {type: string, format: uuid}
        form: {$ref: "#/components/schemas/ApplicationForm"}
    ApplicationForm:
      type: object
      additionalProperties: false
      required: [members, address]
      properties:
        members: {type: array, minItems: 1, maxItems: 10, items: {$ref: "#/components/schemas/ApplicantMember"}}
        address: {$ref: "#/components/schemas/IllinoisAddress"}
    ApplicantMember:
      type: object
      additionalProperties: false
      required: [full_name, date_of_birth, relationship, citizenship_status, medicare_entitled, zero_income, jobs]
      properties:
        full_name: {type: string, minLength: 1, maxLength: 100}
        date_of_birth: {type: string, format: date}
        relationship: {type: string, enum: [self, spouse, partner, child, parent, sibling, other_relative, other]}
        citizenship_status: {type: string, enum: [us_citizen, qualifying_immigrant, neither]}
        medicare_entitled: {type: boolean}
        zero_income: {type: boolean}
        jobs: {type: array, maxItems: 5, items: {$ref: "#/components/schemas/Job"}}
    Job:
      type: object
      additionalProperties: false
      required: [employer, pay_frequency, declared_monthly_gross]
      properties:
        employer: {type: string, minLength: 1, maxLength: 100}
        pay_frequency: {type: string, enum: [weekly, biweekly, semimonthly, monthly]}
        declared_monthly_gross: {type: string, pattern: "^\\d{1,7}(\\.\\d{1,2})?$"}
    IllinoisAddress:
      type: object
      additionalProperties: false
      required: [line1, city, state, postal_code]
      properties:
        line1: {type: string, minLength: 1, maxLength: 100}
        line2: {type: [string, "null"], maxLength: 100}
        city: {type: string, minLength: 1, maxLength: 60}
        state: {type: string, const: IL}
        postal_code: {type: string, pattern: "^\\d{5}$"}
    ReviewActionBody:
      type: object
      additionalProperties: false
      required: [action, request_id]
      properties:
        action: {type: string, enum: [approve_denial, override_to_approve]}
        reason: {type: [string, "null"], maxLength: 500}
        request_id: {type: string, format: uuid}
    CaseStatus:
      type: object
      required: [case_id, state, received_on, decision_deadline, days_remaining, at_risk, outcome, denial_reason, open_review_task]
      properties:
        case_id: {type: string, format: uuid}
        state: {$ref: "#/components/schemas/CaseState"}
        received_on: {type: string, format: date}
        decision_deadline: {type: string, format: date}
        days_remaining: {type: [integer, "null"]}
        at_risk: {type: boolean}
        outcome: {type: [string, "null"], enum: [approved, denied, null]}
        denial_reason: {type: [string, "null"], enum: [income_over_limit, other_rule_not_met, missing_information, null]}
        open_review_task:
          type: [object, "null"]
          required: [task_id, reason, allowed_actions]
          properties:
            task_id: {type: string, format: uuid}
            reason: {type: string}
            allowed_actions: {type: array, items: {type: string}}
    CaseDetail:
      allOf:
        - {$ref: "#/components/schemas/CaseStatus"}
        - type: object
          required: [case_type, coverage_period, override, demo_clock]
          properties:
            case_type: {type: string, enum: [application, redetermination]}
            coverage_period:
              type: [object, "null"]
              required: [start_date, end_date, status]
              properties:
                start_date: {type: string, format: date}
                end_date: {type: string, format: date}
                status: {type: string, enum: [active, continued_pending_review, renewed, ended]}
            override:
              type: [object, "null"]
              required: [reviewer_name, reason, decided_on]
              properties:
                reviewer_name: {type: string}
                reason: {type: [string, "null"], description: null for applicants}
                decided_on: {type: string, format: date}
            demo_clock: {type: boolean, description: "clock.scale > 1; the UI then shows real times too"}
    CaseSummary:
      type: object
      required: [case_id, case_type, state, received_on, decision_deadline, days_remaining, at_risk, outcome]
      properties:
        case_id: {type: string, format: uuid}
        case_type: {type: string, enum: [application, redetermination]}
        state: {$ref: "#/components/schemas/CaseState"}
        received_on: {type: string, format: date}
        decision_deadline: {type: string, format: date}
        days_remaining: {type: [integer, "null"]}
        at_risk: {type: boolean}
        outcome: {type: [string, "null"], enum: [approved, denied, null]}
    CasePage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CaseSummary"}}
        next_cursor: {type: [string, "null"]}
    CaseHistoryEntry:
      type: object
      required: [seq, kind, from_state, to_state, case_time, real_time, actor, actor_type, reason_code]
      properties:
        seq: {type: integer, minimum: 1}
        kind: {type: string, enum: [state_changed, review_task_opened, caseworker_action, action_rejected, notice_requested, coverage_started, demo_action]}
        from_state: {oneOf: [{$ref: "#/components/schemas/CaseState"}, {type: "null"}]}
        to_state: {oneOf: [{$ref: "#/components/schemas/CaseState"}, {type: "null"}]}
        case_time: {type: string, format: date-time}
        real_time: {type: string, format: date-time}
        actor: {type: string, description: "\"System\" or the caseworker's display name"}
        actor_type: {type: string, enum: [system, user]}
        reason_code: {type: string, pattern: "^[a-z0-9_]+$"}
    CaseHistoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/CaseHistoryEntry"}}
        next_cursor: {type: [integer, "null"]}
    ErrorEnvelope:
      description: Error format of specs/000 R11 (packages/domain/errors.py), plus related_case_id (ADR-001-09)
      type: object
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, fields, reference_id]
          properties:
            code: {type: string}
            message: {type: string}
            fields:
              type: array
              items:
                type: object
                required: [field, message, type]
                properties:
                  field: {type: string}
                  message: {type: string}
                  type: {type: string}
            reference_id: {type: string}
            related_case_id: {type: [string, "null"], format: uuid}
