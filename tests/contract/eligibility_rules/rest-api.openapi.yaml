openapi: 3.1.0
info:
  title: Benefit Case Platform - 003 determinations (additive to benefit-be openapi/openapi.json)
  version: 0.3.0
paths:
  /api/v1/cases/{case_id}/determinations:
    get:
      operationId: listCaseDeterminations
      tags: [cases]
      summary: Determinations of a case, newest first, with the per-rule trace (FR-003-23)
      description: Roles caseworker and supervisor. Applicants get 403. Read is audited.
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeterminationList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
components:
  responses:
    Error:
      description: ErrorEnvelope (000)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ErrorEnvelope:
      description: Defined by 000 (packages/domain/errors.py); referenced, not redefined.
      type: object
    DeterminationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/DeterminationView' }
    DeterminationView:
      type: object
      additionalProperties: false
      required: [determination_id, result, reason_code, as_of_date, rule_set_id, rule_set_version,
                 household_size, household_monthly_income, monthly_income_limit, rules,
                 missing_items, recorded_at]
      properties:
        determination_id: { type: string, format: uuid }
        result: { type: string, enum: [eligible, ineligible, cannot_determine] }
        reason_code:
          type: [string, 'null']
          enum: [income_over_limit, other_rule_not_met, null]
        as_of_date: { type: string, format: date }
        rule_set_id: { type: [string, 'null'] }
        rule_set_version: { type: [integer, 'null'] }
        household_size: { type: integer, minimum: 0 }
        household_monthly_income: { type: [string, 'null'], description: decimal string }
        monthly_income_limit: { type: [string, 'null'], description: decimal string }
        recorded_at: { type: string, format: date-time }
        rules:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/RuleResult' }
        missing_items:
          type: array
          items: { $ref: '#/components/schemas/MissingItem' }
    RuleResult:
      type: object
      additionalProperties: false
      required: [rule_id, outcome, inputs, threshold, policy_ref, missing]
      properties:
        rule_id: { type: string, enum: [ELIG-01, ELIG-02, ELIG-03, ELIG-04, ELIG-05, ELIG-06] }
        outcome: { type: string, enum: [pass, fail, missing] }
        inputs:
          type: object
          additionalProperties: { type: string }
          description: Canonical strings; member and job IDs only, never names.
        threshold: { type: [string, 'null'] }
        policy_ref: { type: string }
        missing:
          type: array
          items: { $ref: '#/components/schemas/MissingItem' }
    MissingItem:
      type: object
      additionalProperties: false
      required: [item, member_id, job_id, reason]
      properties:
        item: { type: string }
        member_id: { type: [string, 'null'], format: uuid }
        job_id: { type: [string, 'null'], format: uuid }
        reason: { type: string }
